name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create Mikk Bot Token
        uses: actions/create-github-app-token@v1
        id: bot-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # Required for changesets to compare against main
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        # Changesets needs a local 'main' branch to compare against
        run: git fetch origin main:main

      - name: Check for Changesets
        id: changeset-check
        if: github.event_name == 'pull_request'
        # This will fail the CI if the PR contributor forgets to add a changeset file
        run: bun changeset status

      - name: "Mikk Bot: Post Changeset Instruction"
        if: failure() && steps.changeset-check.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🦋 Changeset Missing: Action Required
            This Pull Request modifies packages but no **Changeset** was detected. Without a changeset, the automated release pipeline cannot version or publish these updates.

            ---

            ### How to Fix:
            Please run the following commands in your local terminal and commit the result:

            1. **Initialize Changeset**:
               ```bash
               bun changeset
               ```
            2. **Select Packages**: Use the arrow keys and spacebar to select the packages you've modified.
            3. **Select Bump Type**: Choose **`patch`** (for bug fixes) or **`minor`** (for new features).
            4. **Add Summary**: Enter a brief description of what you changed.
            5. **Commit & Push**:
               ```bash
               git add .changeset/*.md
               git commit -m "chore: add changeset for release"
               git push
               ```

            *Once the changeset is pushed, the CI will automatically re-run and pass!* 🟢

      - name: Build all packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test
